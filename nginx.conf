server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Allow profile picture uploads (backend limit is 5 MB, multipart has overhead)
    client_max_body_size 8m;

    # Use Docker's embedded DNS so the api hostname is re-resolved if the
    # api container is ever recreated with a new IP (prevents stale-IP 502s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy API calls to the .NET API container (compose service: api).
    # The full original URI (e.g. /api/users/login) is forwarded unchanged.
    location /api/ {
        set $api_upstream http://api:80;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Uploaded profile pictures are served from the API's wwwroot/Profiles
    location /Profiles/ {
        set $api_upstream http://api:80;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Single-page-app fallback: let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
